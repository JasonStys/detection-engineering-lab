# Jason Stys: least-privilege matrix and security gates; no artifact or cache uploads.
# Jobs: portable-windows (real GUI/package/reopen), quality (four OS/Python lanes), security.
# Variables: matrix.os/python select hosted workers; no account secrets enter tests.
name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-windows:
    name: Windows / actual offline GUI executable
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'
      - name: Install exact reviewed development and native-build hashes
        run: python -m pip install --require-hashes -r requirements-dev.lock -r requirements-native.lock
      - run: python -m pip check
      - run: python -m pip_audit -r requirements-native.lock --disable-pip --no-deps
      - run: python scripts/build_native.py
      - name: Actual Tk controls, independent core oracles, exact export, two processes and durable reopen
        run: python scripts/test_native_app.py
  quality:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Source GUI import runtime on disposable Linux worker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libtk8.6
      - name: Install reviewed hash locks
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Quality, replay and measured performance
        shell: bash
        run: bash scripts/validate.sh
      - name: Results in logs and summary only
        if: always()
        run: python scripts/summary.py
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Audit all locked development and runtime dependencies
        run: python -m pip_audit -r requirements-dev.lock --disable-pip --no-deps
      - name: Install verified official scanners
        run: |
          python scripts/tools.py gitleaks
          python scripts/tools.py trivy
          python scripts/tools.py actionlint
      - name: Secrets and high/critical vulnerability/misconfiguration gates
        run: |
          .tools/gitleaks git . --redact --no-banner
          .tools/trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git,.tools,.venv,out .
          .tools/actionlint
          shellcheck scripts/validate.sh
      - name: Security results
        run: |
          printf '%s\n' '## Security gates passed' '' 'Dependency audit, secret scan, HIGH/CRITICAL configuration/dependency scan, actionlint and ShellCheck. No advisory suppressions and no artifact/cache uploads.' >> "$GITHUB_STEP_SUMMARY"
